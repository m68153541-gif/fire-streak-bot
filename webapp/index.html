<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Огонек</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/webapp/style.css">
</head>
<body>
    <div class="app-container">
        <button id="selectPartnerBtn" class="main-btn">👥 Выбрать собеседника</button>
        <div id="partnerList" class="hidden"></div>

        <!-- Персонаж -->
        <div class="character-container">
            <!-- Слой с одеждой (абсолютное позиционирование) -->
            <div id="layer-shirt" class="layer shirt"></div>
            <div id="layer-scarf" class="layer scarf"></div>
            <div id="layer-hat" class="layer hat"></div>
            
            <!-- Сам огонек -->
            <div id="fireCharacter" class="fire">🔥</div>
            
            <!-- Имя и дни -->
            <div id="fireName" class="fire-name">Огонек</div>
        </div>

        <!-- Панель кастомизации -->
        <div class="customization-panel">
            <div class="tabs">
                <button class="tab-btn active" data-target="tab-hats">Шапки</button>
                <button class="tab-btn" data-target="tab-shirts">Футболки</button>
                <button class="tab-btn" data-target="tab-jackets">Куртки</button>
            </div>

            <!-- Вкладка: Шапки -->
            <div id="tab-hats" class="tab-content active">
                <button class="item-btn" data-type="hat" data-value="cap">🧢 Кепка</button>
                <button class="item-btn" data-type="hat" data-value="crown">👑 Корона</button>
                <button class="item-btn" data-type="hat" data-value="beanie">🧶 Шапка</button>
            </div>

            <!-- Вкладка: Футболки -->
            <div id="tab-shirts" class="tab-content">
                <button class="item-btn" data-type="shirt" data-value="tshirt">👕 Белая</button>
                <button class="item-btn" data-type="shirt" data-value="hoodie">🧥 Худи</button>
            </div>

            <!-- Вкладка: Куртки (Шарфы) -->
            <div id="tab-jackets" class="tab-content">
                <button class="item-btn" data-type="scarf" data-value="red">🧣 Красный</button>
                <button class="item-btn" data-type="scarf" data-value="blue">🧣 Синий</button>
            </div>

            <input type="text" id="fireNameInput" placeholder="Имя огонька" maxlength="20">
            <button id="saveBtn" class="main-btn">Сохранить</button>
        </div>
    </div>
    <script src="/webapp/app.js"></script>
</body>
</html>
