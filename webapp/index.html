<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Огонек</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
        body { margin: 0; overflow: hidden; background: #0f0f1a; font-family: 'Nunito', sans-serif; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; outline: none; }
        
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; box-sizing: border-box; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        .currency-panel { background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; display: flex; align-items: center; gap: 5px; color: #ffd700; font-weight: 900; font-size: 18px; pointer-events: auto; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        
        .my-profile { display: flex; flex-direction: column; align-items: center; pointer-events: auto; }
        .my-avatar { width: 50px; height: 50px; border-radius: 50%; background: #3390ec; border: 2px solid white; display: flex; justify-content: center; align-items: center; font-size: 20px; color: white; font-weight: bold; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .my-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .my-name { color: white; font-size: 12px; margin-top: 5px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        .center-info { position: absolute; top: 12%; width: 100%; text-align: center; pointer-events: none; z-index: 5; }
        .fire-name { font-size: 28px; font-weight: 900; color: white; text-shadow: 0 4px 15px rgba(0,0,0,0.9); }
        .fire-days { font-size: 18px; font-weight: 800; color: #ffd700; text-shadow: 0 2px 8px rgba(0,0,0,0.9); margin-top: 5px;}
        
        .bottom-panel { display: flex; flex-direction: column; gap: 15px; pointer-events: auto; }
        .friends-row { display: flex; gap: 10px; overflow-x: auto; padding: 5px 0; justify-content: flex-start; scrollbar-width: none; }
        .friends-row::-webkit-scrollbar { display: none; }
        .friend-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; opacity: 0.5; transition: 0.2s; min-width: 65px; }
        .friend-item.active { opacity: 1; transform: scale(1.1); }
        
        .friend-item .avatar-circle { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #3390ec, #00c6ff); border: 2px solid transparent; display: flex; justify-content: center; align-items: center; font-size: 20px; color: white; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .friend-item.active .avatar-circle { border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.6); }
        .friend-item .profile-name { font-size: 12px; color: white; margin-top: 5px; text-shadow: 0 1px 4px rgba(0,0,0,0.9); max-width: 65px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
        
        .action-buttons { display: flex; justify-content: center; gap: 10px; }
        .action-btn { background: linear-gradient(135deg, rgba(51,144,236,0.8), rgba(0,86,179,0.8)); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 12px 20px; border-radius: 15px; font-size: 14px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(5px); flex: 1; display: flex; justify-content: center; align-items: center; gap: 5px;}
        
        .speech-bubble { position: absolute; top: 25%; left: 50%; transform: translateX(-50%) scale(0); background: white; color: #333; padding: 12px 25px; border-radius: 25px; font-size: 18px; font-weight: 900; box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; z-index: 50; white-space: nowrap; }
        .speech-bubble.show { transform: translateX(-50%) scale(1); opacity: 1; }
        
        .model-error { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); color: #ff6b6b; font-size: 14px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 10px; display: none; z-index: 100; pointer-events: none; text-align: center; border: 1px solid #ff6b6b;}
        .loader-text { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); color: #ffd700; font-size: 16px; font-weight: bold; display: none; z-index: 100; pointer-events: none;}

        /* Модальные окна */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,15,26,0.9); backdrop-filter: blur(10px); z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; pointer-events: auto; }
        .modal.active { display: flex; }
        .modal-content { background: rgba(30,30,50,0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; width: 100%; max-width: 350px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); text-align: center; }
        .modal-title { color: white; font-size: 22px; font-weight: 900; margin-bottom: 20px; }
        .catalog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .catalog-item { background: rgba(255,255,255,0.05); border: 2px solid transparent; border-radius: 15px; padding: 10px; cursor: pointer; transition: 0.2s; }
        .catalog-item:hover { background: rgba(255,255,255,0.1); }
        .catalog-item.active { border-color: #ffd700; background: rgba(255,215,0,0.1); }
        .catalog-item div { font-size: 40px; margin-bottom: 5px; }
        .catalog-item span { color: white; font-size: 12px; font-weight: bold; display: block; }
        .close-btn { background: #3390ec; color: white; border: none; padding: 12px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        .stats-row { display: flex; justify-content: space-between; color: white; font-size: 16px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .stats-row:last-child { border-bottom: none; }
        .stats-label { opacity: 0.7; }
        .stats-value { font-weight: 900; color: #ffd700; }

        .heart { position: absolute; color: #ff4d4d; font-size: 24px; pointer-events: none; z-index: 60; animation: floatUp 1s ease-out forwards; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-100px) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

    <div class="ui-layer">
        <div class="speech-bubble" id="speechBubble"></div>
        <div class="model-error" id="modelError">⚠️ Модель не загружена</div>
        <div class="loader-text" id="loaderText">⏳ Загрузка огонька...</div>

        <div class="top-bar">
            <div class="currency-panel">⭐ <span id="currencyCount">0</span></div>
            <div class="my-profile">
                <div class="my-avatar" id="myAvatar">Т</div>
                <div class="my-name" id="myName">@user</div>
            </div>
        </div>

        <div class="center-info">
            <div class="fire-name" id="fireNameTag">Загрузка...</div>
            <div class="fire-days" id="fireDaysTag">🔥 вместе 0 дней</div>
        </div>

        <div class="bottom-panel">
            <div class="friends-row" id="friendsRow"></div>
            <div class="action-buttons">
                <button class="action-btn" id="btnCatalog">🛍 Каталог</button>
                <button class="action-btn" id="btnStats">📊 Статистика</button>
            </div>
        </div>
    </div>

    <div class="modal" id="catalogModal">
        <div class="modal-content">
            <div class="modal-title">Выбери огонек</div>
            <div class="catalog-grid">
                <div class="catalog-item" data-model="standart"><div>🔥</div><span>Стандарт</span></div>
                <div class="catalog-item" data-model="snow"><div>❄️</div><span>Зимний</span></div>
                <div class="catalog-item" data-model="happy"><div>😊</div><span>Веселый</span></div>
            </div>
            <button class="close-btn" onclick="document.getElementById('catalogModal').classList.remove('active')">Закрыть</button>
        </div>
    </div>

    <div class="modal" id="statsModal">
        <div class="modal-content">
            <div class="modal-title">Статистика</div>
            <div id="statsContent" style="margin-bottom: 20px;"></div>
            <button class="close-btn" onclick="document.getElementById('statsModal').classList.remove('active')">Закрыть</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        const tgUser = tg.initDataUnsafe?.user || { id: 0, first_name: "User", username: "user" };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a15); 
        scene.fog = new THREE.FogExp2(0x0a0a15, 0.05);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 9); 
        camera.lookAt(0, 1.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 2.1; controls.minPolarAngle = Math.PI / 4;
        controls.target.set(0, 1.5, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const keyLight = new THREE.DirectionalLight(0xffeedd, 2);
        keyLight.position.set(5, 10, 5); keyLight.castShadow = true; scene.add(keyLight);
        const rimLight = new THREE.DirectionalLight(0x4466ff, 3);
        rimLight.position.set(-5, 5, -5); scene.add(rimLight);

        const moonGeo = new THREE.SphereGeometry(2, 32, 32);
        const moonMat = new THREE.MeshBasicMaterial({ color: 0x88aaff, transparent: true, opacity: 0.2 });
        const moon = new THREE.Mesh(moonGeo, moonMat); moon.position.set(-15, 15, -20); scene.add(moon);

        const podiumGeo = new THREE.CylinderGeometry(3, 3.2, 0.5, 64);
        const podiumMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.2, metalness: 0.8 });
        const podium = new THREE.Mesh(podiumGeo, podiumMat); podium.position.y = -0.25; podium.receiveShadow = true; scene.add(podium);

        const ringGeo = new THREE.TorusGeometry(2.9, 0.05, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x3390ec });
        const ring = new THREE.Mesh(ringGeo, ringMat); ring.rotation.x = Math.PI / 2; ring.position.y = 0.01; scene.add(ring);

        const treeGeo = new THREE.ConeGeometry(1, 4, 6);
        const treeMat = new THREE.MeshStandardMaterial({ color: 0x111122 });
        for (let i = 0; i < 20; i++) {
            const tree = new THREE.Mesh(treeGeo, treeMat);
            const angle = (i / 20) * Math.PI * 2;
            const radius = 8 + Math.random() * 5;
            tree.position.set(Math.cos(angle) * radius, 1.5, Math.sin(angle) * radius);
            tree.rotation.y = Math.random() * Math.PI; scene.add(tree);
        }

        const loader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        let currentFire = null; let originalFireY = 0; let isJumping = false;
        let friendsData = []; let currentFriendIndex = 0;
        const modelErrorEl = document.getElementById('modelError');
        const loaderTextEl = document.getElementById('loaderText');

        function getAvatarColor(id) {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#98D8C8'];
            return colors[Math.abs(id) % colors.length];
        }

        async function loadData() {
            try {
                const res = await fetch(`/api/get_user_data?user_id=${tgUser.id}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                
                document.getElementById('myName').textContent = "@" + (tgUser.username || tgUser.first_name);
                const avatarEl = document.getElementById('myAvatar');
                if (tgUser.photo_url) avatarEl.innerHTML = `<img src="${tgUser.photo_url}" alt="Avatar">`;
                else {
                    avatarEl.style.backgroundColor = getAvatarColor(tgUser.id);
                    avatarEl.textContent = (tgUser.first_name || "U")[0].toUpperCase();
                }

                friendsData = data.streaks || [];
                if (friendsData.length > 0) {
                    updateUI();
                } else {
                    document.getElementById('fireNameTag').textContent = "Нет серий";
                    document.getElementById('loaderText').style.display = 'none';
                }
            } catch (e) { 
                console.error("API Error:", e);
                document.getElementById('fireNameTag').textContent = "Ошибка сети";
                document.getElementById('loaderText').style.display = 'none';
            }
        }

        function updateUI() {
            if (!friendsData.length) return;
            const f = friendsData[currentFriendIndex];
            
            document.getElementById('fireNameTag').textContent = f.name + ' ✏️';
            document.getElementById('fireDaysTag').textContent = `🔥 вместе ${f.streak} дней`;

            let modelFile = "standart.glb";
            if (f.is_gray) modelFile = "hold.glb";
            else if (f.model === "snow") modelFile = "snow.glb";
            else if (f.model === "happy") modelFile = "happy.glb";

            loadModel(modelFile);
            renderFriendsList();
            updateCatalogSelection(f.model);
        }

        async function loadModel(fileName) {
            if (currentFire) { scene.remove(currentFire); currentFire = null; }
            modelErrorEl.style.display = 'none'; loaderTextEl.style.display = 'block';

            const url = `/api/model_base64/${fileName}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!data.base64) throw new Error("Пустой ответ");
                
                const binaryString = atob(data.base64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                
                loader.parse(bytes.buffer, '', (gltf) => {
                    setupModel(gltf.scene); loaderTextEl.style.display = 'none';
                }, (err) => { showError(`⚠️ Ошибка 3D-модели`); });
            } catch (err) { showError(`⚠️ Сбой сети. Попробуйте позже.`); }
        }

        function showError(msg) {
            modelErrorEl.textContent = msg; modelErrorEl.style.display = 'block'; loaderTextEl.style.display = 'none';
        }

        function setupModel(model) {
            currentFire = model;
            const box = new THREE.Box3().setFromObject(currentFire);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 2.5 / maxDim; 
            currentFire.scale.set(scale, scale, scale);
            currentFire.position.set(0, 0, 0); 
            currentFire.position.y = -box.min.y * scale; 
            originalFireY = currentFire.position.y;
            scene.add(currentFire);
        }

        function renderFriendsList() {
            const row = document.getElementById('friendsRow'); row.innerHTML = '';
            friendsData.forEach((f, index) => {
                const div = document.createElement('div');
                div.className = `friend-item ${index === currentFriendIndex ? 'active' : ''}`;
                div.onclick = () => { currentFriendIndex = index; updateUI(); };
                const char = f.name && f.name !== "ID:" ? f.name[1].toUpperCase() : "?";
                const bgColor = getAvatarColor(f.partner_id || index);
                div.innerHTML = `<div class="avatar-circle" style="background: ${bgColor};">${char}</div><div class="profile-name">${f.name}</div>`;
                row.appendChild(div);
            });
        }

        const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
        const bubble = document.getElementById('speechBubble');
        const phrases = ["Я тебя обожаю! ❤️", "Ты лучший! 🌟", "Еще один день вместе! 🔥", "Спасибо за тепло! ☀️"];

        function showMessage(text) {
            bubble.textContent = text; bubble.classList.add('show');
            setTimeout(() => { bubble.classList.remove('show'); }, 2000);
        }

        function spawnHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart'; heart.innerHTML = '❤️';
            heart.style.left = (window.innerWidth / 2 + (Math.random() - 0.5) * 100) + 'px';
            heart.style.top = (window.innerHeight / 2 + (Math.random() - 0.5) * 50) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1000);
        }

        renderer.domElement.addEventListener('pointerdown', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (currentFire) {
                const intersects = raycaster.intersectObject(currentFire, true);
                if (intersects.length > 0) {
                    showMessage(phrases[Math.floor(Math.random() * phrases.length)]);
                    for(let i=0; i<3; i++) setTimeout(spawnHeart, i*100);
                    
                    if (!isJumping) {
                        isJumping = true;
                        const startTime = Date.now(); const jumpDuration = 500;
                        const jumpInterval = setInterval(() => {
                            const elapsed = Date.now() - startTime;
                            if (elapsed >= jumpDuration) {
                                currentFire.position.y = originalFireY; isJumping = false; clearInterval(jumpInterval);
                            } else {
                                const progress = elapsed / jumpDuration;
                                currentFire.position.y = originalFireY + Math.sin(progress * Math.PI) * 0.5;
                            }
                        }, 16);
                    }
                    const f = friendsData[currentFriendIndex];
                    fetch('/api/sync_taps', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: tgUser.id, chat_id: f.chat_id })
                    });
                }
            }
        });

        const btnCatalog = document.getElementById('btnCatalog');
        const catalogModal = document.getElementById('catalogModal');
        const catalogItems = document.querySelectorAll('.catalog-item');

        btnCatalog.onclick = () => catalogModal.classList.add('active');
        catalogItems.forEach(item => {
            item.onclick = async () => {
                const modelName = item.dataset.model;
                const f = friendsData[currentFriendIndex];
                f.model = modelName;
                updateCatalogSelection(modelName);
                catalogModal.classList.remove('active');
                updateUI();
                await fetch('/api/set_model', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: f.chat_id, model: modelName })
                });
            };
        });

        function updateCatalogSelection(currentModel) {
            catalogItems.forEach(item => {
                if (item.dataset.model === currentModel) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        const btnStats = document.getElementById('btnStats');
        const statsModal = document.getElementById('statsModal');
        const statsContent = document.getElementById('statsContent');

        btnStats.onclick = () => {
            const f = friendsData[currentFriendIndex];
            const isMeUserA = (tgUser.id === f.user_a);
            const myTaps = isMeUserA ? f.total_taps_a : f.total_taps_b;
            const partnerTaps = isMeUserA ? f.total_taps_b : f.total_taps_a;

            statsContent.innerHTML = `
                <div class="stats-row"><span class="stats-label">Дней вместе:</span><span class="stats-value">${f.streak}</span></div>
                <div class="stats-row"><span class="stats-label">Дата начала:</span><span class="stats-value">${f.created_at}</span></div>
                <div class="stats-row"><span class="stats-label">Твои тапы:</span><span class="stats-value">${myTaps}</span></div>
                <div class="stats-row"><span class="stats-label">Тапы партнера:</span><span class="stats-value">${partnerTaps}</span></div>
            `;
            statsModal.classList.add('active');
        };

        loadData();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if (currentFire && !isJumping) {
                const time = Date.now() * 0.002;
                currentFire.position.y = originalFireY + Math.sin(time) * 0.05;
                currentFire.rotation.y += 0.005;
            }
            ring.rotation.z += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
