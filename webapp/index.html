<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Огонек</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: 'Nunito', sans-serif; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; outline: none; }
        
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; box-sizing: border-box; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        .currency-panel { background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 20px; display: flex; align-items: center; gap: 5px; color: #ffd700; font-weight: 900; font-size: 18px; pointer-events: auto; backdrop-filter: blur(10px); }
        
        .my-profile { display: flex; flex-direction: column; align-items: center; pointer-events: auto; }
        .my-avatar { width: 50px; height: 50px; border-radius: 50%; background: #3390ec; border: 2px solid white; display: flex; justify-content: center; align-items: center; font-size: 20px; color: white; font-weight: bold; overflow: hidden; }
        .my-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .my-name { color: white; font-size: 12px; margin-top: 5px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        .center-info { position: absolute; top: 12%; width: 100%; text-align: center; pointer-events: none; z-index: 5; }
        .fire-name { font-size: 28px; font-weight: 900; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .fire-days { font-size: 16px; font-weight: 800; color: #ffd700; text-shadow: 0 2px 5px rgba(0,0,0,0.8); margin-top: 5px;}
        
        .bottom-panel { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .friends-row { display: flex; gap: 10px; overflow-x: auto; padding: 5px 0; justify-content: flex-start; scrollbar-width: none; }
        .friends-row::-webkit-scrollbar { display: none; }
        .friend-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; opacity: 0.5; transition: 0.2s; min-width: 60px; }
        .friend-item.active { opacity: 1; transform: scale(1.1); }
        
        .friend-item .avatar-circle { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #3390ec, #00c6ff); border: 2px solid transparent; display: flex; justify-content: center; align-items: center; font-size: 18px; color: white; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .friend-item.active .avatar-circle { border-color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .friend-item .profile-name { font-size: 11px; color: white; margin-top: 3px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
        
        .action-buttons { display: flex; justify-content: center; gap: 10px; }
        .action-btn { background: linear-gradient(135deg, #3390ec, #0056b3); color: white; border: none; padding: 10px 20px; border-radius: 15px; font-size: 14px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 10px rgba(0, 86, 179, 0.4); }
        
        .speech-bubble { position: absolute; top: 25%; left: 50%; transform: translateX(-50%) scale(0); background: white; color: #333; padding: 10px 20px; border-radius: 20px; font-size: 18px; font-weight: 900; box-shadow: 0 10px 25px rgba(0,0,0,0.3); opacity: 0; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; z-index: 50; white-space: nowrap; }
        .speech-bubble.show { transform: translateX(-50%) scale(1); opacity: 1; }
        
        .model-error { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); color: #ff6b6b; font-size: 14px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; display: none; z-index: 100; pointer-events: none; text-align: center; }
    </style>
</head>
<body>

    <div class="ui-layer">
        <div class="speech-bubble" id="speechBubble"></div>
        <div class="model-error" id="modelError">⚠️ Модель не загружена. Проверьте консоль.</div>

        <div class="top-bar">
            <div class="currency-panel">⭐ <span id="currencyCount">0</span></div>
            <div class="my-profile">
                <div class="my-avatar" id="myAvatar">Т</div>
                <div class="my-name" id="myName">@user</div>
            </div>
        </div>

        <div class="center-info">
            <div class="fire-name" id="fireNameTag">Загрузка...</div>
            <div class="fire-days" id="fireDaysTag">🔥 вместе 0 дней</div>
        </div>

        <div class="bottom-panel">
            <div class="friends-row" id="friendsRow"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Безопасный импорт Base64
        let BASE64_MODEL = null;
        try {
            const module = await import('./model.js');
            BASE64_MODEL = module.BASE64_MODEL || null;
        } catch (e) {
            console.log("model.js не найден или пуст, используем API.");
        }

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const tgUser = tg.initDataUnsafe?.user || { id: 0, first_name: "User", username: "user" };

        // --- Сцена ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e); 
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 10); 
        camera.lookAt(0, 1.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 2; 
        controls.target.set(0, 1.5, 0);

        // --- Свет ---
        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const keyLight = new THREE.DirectionalLight(0xffffff, 2);
        keyLight.position.set(5, 10, 5);
        scene.add(keyLight);

        // --- Логика ---
        const loader = new GLTFLoader();
        let currentFire = null;
        let friendsData = [];
        let currentFriendIndex = 0;
        const modelErrorEl = document.getElementById('modelError');

        // Используем API для загрузки моделей, чтобы обойти CORS в Telegram WebView
        const API_BASE_URL = "/api/model/"; 

        function getAvatarColor(id) {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#98D8C8'];
            return colors[Math.abs(id) % colors.length];
        }

        async function loadData() {
            try {
                const res = await fetch(`/api/get_user_data?user_id=${tgUser.id}`);
                const data = await res.json();
                
                document.getElementById('myName').textContent = "@" + (tgUser.username || tgUser.first_name);
                
                const avatarEl = document.getElementById('myAvatar');
                if (tgUser.photo_url) {
                    avatarEl.innerHTML = `<img src="${tgUser.photo_url}" alt="Avatar">`;
                } else {
                    avatarEl.style.backgroundColor = getAvatarColor(tgUser.id);
                    avatarEl.textContent = (tgUser.first_name || "U")[0].toUpperCase();
                }

                friendsData = data.streaks || [];
                if (friendsData.length > 0) {
                    updateUI();
                }
            } catch (e) { console.error("API Error:", e); }
        }

        function updateUI() {
            if (!friendsData.length) return;
            const f = friendsData[currentFriendIndex];
            
            document.getElementById('fireNameTag').textContent = f.name + ' ✏️';
            document.getElementById('fireDaysTag').textContent = `🔥 вместе ${f.streak} дней`;

            let modelFile = "standart.glb";
            if (f.is_gray) modelFile = "hold.glb";

            loadModel(modelFile);
            renderFriendsList();
        }

        async function loadModel(fileName) {
            if (currentFire) {
                scene.remove(currentFire);
                currentFire = null;
            }
            modelErrorEl.style.display = 'none';

            // 1. ПЫТАЕМСЯ ЗАГРУЗИТЬ ИЗ BASE64 (если строка есть)
            if (BASE64_MODEL && typeof BASE64_MODEL === 'string' && BASE64_MODEL.length > 100) {
                console.log("Загрузка из Base64...");
                try {
                    const binaryString = atob(BASE64_MODEL);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    
                    loader.parse(bytes.buffer, '', (gltf) => {
                        console.log("✅ Модель из Base64 загружена!");
                        setupModel(gltf.scene);
                    }, (err) => {
                        console.error("❌ Ошибка парсинга Base64:", err);
                        loadFromApi(fileName); // Fallback
                    });
                    return;
                } catch (e) {
                    console.error("Ошибка декодирования Base64:", e);
                }
            }

            // 2. ГРУЗИМ ЧЕРЕЗ API (ОБХОД CORS)
            loadFromApi(fileName);
        }

        async function loadFromApi(fileName) {
            const url = `${API_BASE_URL}${fileName}`;
            console.log("Попытка загрузить через API:", url);

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const arrayBuffer = await response.arrayBuffer();
                
                loader.parse(arrayBuffer, '', (gltf) => {
                    console.log("✅ Модель загружена через API!");
                    setupModel(gltf.scene);
                }, (err) => {
                    console.error(`❌ Ошибка парсинга модели ${fileName}:`, err);
                    modelErrorEl.textContent = `⚠️ Ошибка парсинга ${fileName}`;
                    modelErrorEl.style.display = 'block';
                });

            } catch (err) {
                console.error(`❌ Ошибка загрузки ${fileName} через API:`, err);
                modelErrorEl.textContent = `⚠️ Не удалось загрузить ${fileName}. Проверьте консоль.`;
                modelErrorEl.style.display = 'block';
            }
        }

        function setupModel(model) {
            currentFire = model;
            const box = new THREE.Box3().setFromObject(currentFire);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 2.5 / maxDim; 
            
            currentFire.scale.set(scale, scale, scale);
            currentFire.position.set(0, 0, 0); 
            currentFire.position.y = -box.min.y * scale; 
            
            scene.add(currentFire);
            modelErrorEl.style.display = 'none';
        }

        function renderFriendsList() {
            const row = document.getElementById('friendsRow');
            row.innerHTML = '';
            friendsData.forEach((f, index) => {
                const div = document.createElement('div');
                div.className = `friend-item ${index === currentFriendIndex ? 'active' : ''}`;
                div.onclick = () => { currentFriendIndex = index; updateUI(); };
                
                const char = f.name && f.name !== "ID:" ? f.name[1].toUpperCase() : "?";
                const bgColor = getAvatarColor(f.partner_id || index);
                
                div.innerHTML = `<div class="avatar-circle" style="background: ${bgColor};">${char}</div><div class="profile-name">${f.name}</div>`;
                row.appendChild(div);
            });
        }

        const bubble = document.getElementById('speechBubble');
        function showMessage(text) {
            bubble.textContent = text;
            bubble.classList.add('show');
            setTimeout(() => { bubble.classList.remove('show'); }, 2000);
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('pointerdown', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (currentFire) {
                const intersects = raycaster.intersectObject(currentFire, true);
                if (intersects.length > 0) {
                    showMessage("Я тебя обожаю! ❤️");
                    // Здесь можно добавить вызов API для синхронизации тапов, если нужно
                }
            }
        });

        loadData();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
